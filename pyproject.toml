[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reduce_nomic"
version = "0.1.0"
description = "Python port of reduce_nomic.pro, the LBTI/NOMIC imaging reduction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "astropy>=5.0"]

[project.optional-dependencies]
test = ["pytest"]
display = ["matplotlib"]

[project.scripts]
reduce-nomic = "reduce_nomic.cli:main_entry"

[tool.setuptools]
packages = ["reduce_nomic"]

[tool.setuptools.package-data]
reduce_nomic = ["data/*.txt", "data/*.csv"]
